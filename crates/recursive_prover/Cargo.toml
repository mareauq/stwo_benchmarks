[package]
name = "recursive_prover"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "recursive_prover"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# stwo-circuits — vendored path dependencies
circuit-cairo-air       = { path = "../../vendor/stwo-circuits/crates/cairo_air" }
circuit-air             = { path = "../../vendor/stwo-circuits/crates/circuit_air" }
circuit-prover          = { path = "../../vendor/stwo-circuits/crates/circuit_prover" }
circuit-common          = { path = "../../vendor/stwo-circuits/crates/circuit_common" }
circuits                = { path = "../../vendor/stwo-circuits/crates/circuits" }
circuits-stark-verifier = { path = "../../vendor/stwo-circuits/crates/stark_verifier" }
circuit-serialize       = { path = "../../vendor/stwo-circuits/crates/circuit_serialize" }

# stwo-cairo — same git revisions as stwo-circuits/Cargo.toml
cairo-air           = { git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-prover   = { package = "stwo-cairo-prover",  git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-adapter  = { package = "stwo-cairo-adapter", git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }
stwo-cairo-common   = { package = "stwo-cairo-common",  git = "https://github.com/starkware-libs/stwo-cairo", rev = "0a5e70b7" }

# stwo core — same version as stwo-circuits workspace
stwo = { version = "2.2.0", features = ["parallel"], default-features = false }

[profile.release]
opt-level = 3
